# OrcaRouter provider configuration for samik-bot.
# Preconfigured provider entry for opencode2 and pi reviewer engines.

model = "orcarouter/auto"
model_provider = "orcarouter"

[model_providers.orcarouter]
name     = "OrcaRouter"
base_url = "https://api.orcarouter.ai/v1"
wire_api = "responses"
env_key  = "ORCA_KEY"
